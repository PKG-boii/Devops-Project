name: TaskBoard CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run Pytest Test Suite
        run: pytest -v
        working-directory: backend

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and Build React Frontend
        run: |
          npm install
          npm run build
        working-directory: frontend

  build-scan-push:
    name: Build, Scan and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }} ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/taskboard-frontend:${{ github.sha }} ./frontend

      - name: Trivy Vulnerability Scan (Backend)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Trivy Vulnerability Scan (Frontend)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/taskboard-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Push Container Images to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/taskboard-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes via Helm
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        if: env.KUBE_CONFIG_DATA != ''
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          helm upgrade --install taskboard ./helm/taskboard \
            --namespace taskboard \
            --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=ghcr.io/${{ github.repository_owner }}/taskboard-backend \
            --set frontend.image=ghcr.io/${{ github.repository_owner }}/taskboard-frontend
