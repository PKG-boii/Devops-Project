apiVersion: v1
kind: Service
metadata:
  name: taskboard-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: taskboard-backend
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: taskboard-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
