apiVersion: v1
kind: Service
metadata:
  name: taskboard-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: taskboard-frontend
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: taskboard-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
