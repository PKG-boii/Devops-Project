apiVersion: v1
kind: Secret
metadata:
  name: taskboard-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: taskboard-postgres
    {{- include "taskboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: taskboard-postgres
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: taskboard-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taskboard-postgres-data
  namespace: {{ .Values.namespace }}
  labels:
    app: taskboard-postgres
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: taskboard-postgres
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard-postgres
  template:
    metadata:
      labels:
        app: taskboard-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: taskboard-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskboard-postgres
                  key: password
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: taskboard-postgres-data
